[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-trader"
version = "0.1.0"
description = "Demo-first MetaTrader 5 trading bot development project"
requires-python = ">=3.14"
dependencies = [
    "MetaTrader5==5.0.6231",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "requests==2.34.2",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = ["hypothesis==6.170.12", "pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
